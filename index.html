<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactividad y validación</title>
    <link rel="stylesheet" href="style.css?v=20260929-20">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div id="progress-card" class="progress-card" aria-live="polite" role="button" tabindex="0" aria-label="Progreso de las actividades">
                <span id="progress-text">Inicio</span>
                <div class="progress-track" aria-hidden="true">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </header>

        <aside id="dev-panel" class="dev-panel hidden" aria-label="Herramientas de desarrollador">
            <div class="dev-panel-header">
                <strong>Herramientas de desarrollador</strong>
                <button id="dev-close" class="secondary-button" type="button">Cerrar</button>
            </div>
            <div class="dev-grid">
                <label class="field" for="dev-screen-select">
                    <span>Saltar a pantalla</span>
                    <select id="dev-screen-select"></select>
                </label>
                <button id="dev-go-screen" type="button">Ir</button>
                <button id="dev-prev-screen" class="secondary-button" type="button">Anterior</button>
                <button id="dev-next-screen" class="secondary-button" type="button">Siguiente</button>
                <button id="dev-fill-student" class="secondary-button" type="button">Completar alumno</button>
                <button id="dev-complete-password" class="secondary-button" type="button">Completar contraseña</button>
                <button id="dev-reset-game" class="secondary-button" type="button">Reiniciar partida</button>
                <button id="dev-open-readme" class="secondary-button" type="button">Ver README</button>
            </div>
            <p id="dev-message" class="dev-message" aria-live="polite">Panel para armar y testear el recorrido sin completar todo manualmente.</p>
        </aside>

        <main id="app" class="screen" tabindex="-1"></main>
    </div>

    <script src="script.js?v=20260929-20"></script>
</body>
</html>
